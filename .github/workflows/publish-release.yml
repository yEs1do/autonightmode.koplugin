name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - scheduleddisplay.koplugin/_meta.lua
      - CHANGELOG.md
      - README.md
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' scheduleddisplay.koplugin/_meta.lua)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build plugin archive
        shell: bash
        run: |
          zip -r scheduleddisplay.koplugin.zip scheduleddisplay.koplugin

      - name: Remove superseded 0.1.2 release
        if: ${{ steps.meta.outputs.version == '0.2.0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v0.1.2" >/dev/null 2>&1; then
            gh release delete "v0.1.2" --yes --cleanup-tag
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          tag="v$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          awk -v v="$version" '
            $0 == "## " v { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          test -s /tmp/release-notes.md

          gh release create "$tag"             --target "$GITHUB_SHA"             --title "自动显示调节 $tag"             --notes-file /tmp/release-notes.md             scheduleddisplay.koplugin.zip
